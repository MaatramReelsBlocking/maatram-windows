[package]
name = "maatram-guard"
version = "0.1.0"
description = "Maatram Hard Lock guard for Linux and macOS (runs as root, no window)"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
