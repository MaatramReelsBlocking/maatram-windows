[package]
name = "maatram-hardlock"
version = "0.1.0"
description = "Maatram Hard Lock for Windows and Linux"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
