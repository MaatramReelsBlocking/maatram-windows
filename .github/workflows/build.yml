name: Build Windows exe

on:
  pull_request:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: |
          python -m pip install pillow
          python tools/make_icons.py

      # Prebuilt Tauri CLI via npx: no package.json, the project itself stays pure Rust + one HTML file.
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe
