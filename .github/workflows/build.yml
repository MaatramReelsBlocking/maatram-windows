name: Build Maatram Hard Lock

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Generate icons
        run: |
          python -m pip install pillow
          python tools/make_icons.py

      # Prebuilt Tauri CLI via npx: no package.json, the project itself stays pure Rust + one HTML file.
      - name: Build installer
        run: npx --yes @tauri-apps/cli@2 build

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-windows
          path: src-tauri/target/release/bundle/nsis/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: src-tauri/target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            guard

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libssl-dev patchelf rpm musl-tools

      - name: Logic tests
        run: rustc --edition 2021 --test src-tauri/src/logic.rs -o /tmp/logic_test && /tmp/logic_test

      - name: Generate icons
        run: |
          python -m pip install pillow
          python tools/make_icons.py

      # The guard is the root program that does the locking. It is built static and carried inside the window.
      - name: Build the guard
        run: |
          cargo build --release --manifest-path guard/Cargo.toml --target x86_64-unknown-linux-musl
          mkdir -p src-tauri/guard-bin
          cp guard/target/x86_64-unknown-linux-musl/release/maatram-guard src-tauri/guard-bin/maatram-guard

      - name: Build AppImage, deb and rpm
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: npx --yes @tauri-apps/cli@2 build --bundles appimage,deb,rpm

      # Fixed names, so maatram.co.in can link to .../releases/latest/download/<name>.
      - name: Name the files
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/appimage/*.AppImage out/maatram-hardlock-linux-x86_64.AppImage
          cp src-tauri/target/release/bundle/deb/*.deb out/maatram-hardlock-linux-amd64.deb
          cp src-tauri/target/release/bundle/rpm/*.rpm out/maatram-hardlock-linux-x86_64.rpm
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-linux
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
            guard

      - name: Generate icons
        run: |
          python -m pip install pillow
          python tools/make_icons.py

      # One guard for both Apple chips (Apple silicon and Intel), signed ad hoc so macOS will run it.
      - name: Build the guard
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --manifest-path guard/Cargo.toml --target $t
          done
          mkdir -p src-tauri/guard-bin
          lipo -create -output src-tauri/guard-bin/maatram-guard \
            guard/target/aarch64-apple-darwin/release/maatram-guard \
            guard/target/x86_64-apple-darwin/release/maatram-guard
          codesign --force --sign - src-tauri/guard-bin/maatram-guard

      - name: Build dmg
        run: npx --yes @tauri-apps/cli@2 build --target universal-apple-darwin --bundles dmg

      - name: Name the file
        run: |
          mkdir out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg out/maatram-hardlock-macos-universal.dmg
          ls -l out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: maatram-hardlock-macos
          path: out/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
